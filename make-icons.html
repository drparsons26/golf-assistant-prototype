<!DOCTYPE html>
<html>
<head>
  <title>Golf Assistant Icon Generator</title>
</head>
<body>
  <h1>Golf Assistant Icon Generator</h1>
  <p>Click the button below to download the app icons.</p>

  <button onclick="downloadIcons()">Download Icons</button>

  <script>
    function drawIcon(size) {
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;

      const ctx = canvas.getContext("2d");

      // Background
      ctx.fillStyle = "#236b35";
      roundRect(ctx, 0, 0, size, size, size * 0.18);
      ctx.fill();

      // Outer golf circle
      ctx.fillStyle = "#f2f5f1";
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size * 0.30, 0, Math.PI * 2);
      ctx.fill();

      // Inner green circle
      ctx.fillStyle = "#236b35";
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size * 0.23, 0, Math.PI * 2);
      ctx.fill();

      // Inner light circle
      ctx.fillStyle = "#f2f5f1";
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size * 0.17, 0, Math.PI * 2);
      ctx.fill();

      // Flag pole
      ctx.strokeStyle = "#1f2a1f";
      ctx.lineWidth = size * 0.035;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(size / 2, size * 0.23);
      ctx.lineTo(size / 2, size * 0.52);
      ctx.stroke();

      // Flag
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(size / 2, size * 0.23);
      ctx.lineTo(size * 0.67, size * 0.30);
      ctx.lineTo(size / 2, size * 0.37);
      ctx.closePath();
      ctx.fill();

      // Golf ball
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(size / 2, size * 0.64, size * 0.06, 0, Math.PI * 2);
      ctx.fill();

      return canvas;
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function downloadCanvas(canvas, filename) {
      const link = document.createElement("a");
      link.download = filename;
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    function downloadIcons() {
      downloadCanvas(drawIcon(192), "icon-192.png");
      downloadCanvas(drawIcon(512), "icon-512.png");
    }
  </script>
</body>
</html>
